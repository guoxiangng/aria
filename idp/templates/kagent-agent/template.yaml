apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-templates/writing-templates
kind: Template
metadata:
  name: kagent-agent-onboarding
  title: Onboard a new agent
  description: >
    Describe an agent's job; get back a pull request with an agent that already has identity,
    gateway access, platform guardrails, an eval suite and a catalog entry. It deploys as
    `sandbox` on merge. Design: docs/spec-idp-golden-path.md.
  tags:
    - kagent
    - golden-path
spec:
  owner: group:platform-team
  type: kagent-agent

  # The form collects INTENT. Everything a reviewer or the platform must be able to rely on —
  # identity, UI access, gateway access, guardrails, approval on mutating tools — is generated,
  # not asked for. See the spec's §5 for who decides what.
  parameters:
    - title: About the agent
      required: [name, purpose, owner]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase and hyphens. Becomes the agent's identity (cluster.local/ns/kagent/sa/<name>).
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:autofocus: true
        purpose:
          title: Purpose
          type: string
          description: One or two sentences — what job this agent does, for whom. Shown in the catalog.
          maxLength: 300
        owner:
          title: Owner
          type: string
          description: The team accountable for this agent.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        dataSensitivity:
          title: Data sensitivity
          type: string
          description: What the agent may see. POC — a label on the agent and its catalog page.
          enum: [public, internal, confidential]
          default: internal

    - title: Behaviour
      required: [instructions, tier, modelConfig]
      properties:
        instructions:
          title: Instructions
          type: string
          description: >
            The agent's job, in your words — this seeds agents/<name>/prompt.yaml, which you keep
            iterating on in git. Platform guardrails (namespace, evidence, approval rules) are
            added for you; don't repeat them.
          minLength: 40
          ui:widget: textarea
          ui:options:
            rows: 8
        tier:
          title: Tier
          type: string
          enum: [tier1-readonly, tier2-approval]
          enumNames:
            - 'Tier 1 — read-only: diagnoses, never changes anything'
            - 'Tier 2 — can change things, every change needs human approval'
          default: tier1-readonly
        modelConfig:
          title: Model route
          type: string
          description: Both go through the LiteLLM gateway (budgets, fallbacks, tracing).
          enum: [litellm-gateway, litellm-smart-router]
          enumNames:
            - 'litellm-gateway — fixed route (bedrock-haiku-4-5), the fleet default'
            - 'litellm-smart-router — picks a model tier per request'
          default: litellm-gateway
      dependencies:
        tier:
          oneOf:
            - properties:
                tier:
                  const: tier1-readonly
            - properties:
                tier:
                  const: tier2-approval
                mutatingTools:
                  title: Mutating tools
                  description: Reversible only. Each one pauses for human approval — always.
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [k8s_rollout, k8s_scale]
                  ui:widget: checkboxes
              required: [mutatingTools]

    - title: Tools and connections
      required: [readTools]
      properties:
        readTools:
          title: Read tools
          description: From kagent's built-in tool server. Least privilege — pick only what the job needs.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - k8s_get_resources
              - k8s_describe_resource
              - k8s_get_events
              - k8s_get_pod_logs
              - k8s_get_resource_yaml
              - k8s_get_available_api_resources
          ui:widget: checkboxes
        callsAgents:
          title: Agents it may call
          description: >
            Only agents that already have an allow-list are offered: granting access to an agent
            with none would make it deny everyone else (Istio's first ALLOW policy is default-deny).
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [cluster-diagnostics, cloud-diagnostics, cost-sentinel]
          ui:widget: checkboxes
        callers:
          title: Also callable by
          description: The kagent UI can always reach it. Tick incident-commander to allow it too.
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [incident-commander]
          ui:widget: checkboxes

    - title: Evaluation
      required: [examples]
      properties:
        examples:
          title: Example questions
          description: >
            3–5 questions this agent should handle, and what a good answer must contain. They seed
            its eval suite; an agent without a passing suite cannot leave sandbox.
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            required: [question, mustContain]
            properties:
              question:
                title: Question
                type: string
              mustContain:
                title: A good answer must…
                type: string

  steps:
    - id: render
      name: Render the agent, its wiring and its eval suite
      action: fetch:template
      input:
        url: ./content
        targetPath: ./
        values:
          name: ${{ parameters.name }}
          purpose: ${{ parameters.purpose }}
          owner: ${{ parameters.owner }}
          dataSensitivity: ${{ parameters.dataSensitivity }}
          instructions: ${{ parameters.instructions }}
          tier: ${{ parameters.tier }}
          modelConfig: ${{ parameters.modelConfig }}
          readTools: ${{ parameters.readTools }}
          mutatingTools: ${{ parameters.mutatingTools or [] }}
          callsAgents: ${{ parameters.callsAgents or [] }}
          callers: ${{ parameters.callers or [] }}
          examples: ${{ parameters.examples }}

    - id: publish
      name: Open a pull request against aria
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=guoxiangng&repo=aria
        branchName: onboard-agent-${{ parameters.name }}
        title: 'Onboard agent: ${{ parameters.name }} (sandbox)'
        description: |
          Onboards **${{ parameters.name }}** — ${{ parameters.purpose }}

          Generated by the Backstage onboarding template (`idp/templates/kagent-agent/`).

          | | |
          |---|---|
          | Owner | `${{ parameters.owner }}` |
          | Tier | `${{ parameters.tier }}` |
          | Model route | `${{ parameters.modelConfig }}` |
          | Data sensitivity | `${{ parameters.dataSensitivity }}` |
          | Stage on merge | `sandbox` |

          **Files — all new, nothing existing is edited:**
          - `agents/${{ parameters.name }}/agent.yaml` — Agent CR; system message composed from platform guardrails + `prompt.yaml`
          - `agents/${{ parameters.name }}/prompt.yaml` — the author-owned instructions
          - `platform/istio/policies/${{ parameters.name }}-inbound.yaml` — who may call it (kagent UI always)
          - `platform/istio/policies/${{ parameters.name }}-outbound.yaml` — gateway + agents it may call
          - `eval/${{ parameters.name }}.promptfooconfig.yaml` — eval suite seeded from the form's examples
          - `idp/catalog/agents/${{ parameters.name }}.yaml` — catalog entry

          **Reviewer checklist**
          - [ ] Instructions in `prompt.yaml` describe the job, and don't contradict the platform guardrails
          - [ ] Tool list is the minimum the job needs
          - [ ] Tier 2 only: every mutating tool is in `requireApproval`
          - [ ] If incident-commander is a caller: it also needs this agent added to its own `tools` (not generated)

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish'].output.remoteUrl }}
