# Backstage catalog entry for ${{ values.name }} — generated by the onboarding template.
# Picked up by the glob location in idp/backstage/values.yaml (idp/catalog/agents/*.yaml) once
# this PR merges. Lives here, NOT in agents/${{ values.name }}/: the ArgoCD `agents` app applies
# every agents/*/*.yaml to the cluster, and a Backstage entity is not a Kubernetes object.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.purpose | dump }}
  tags:
    - aria
    - declarative
    - evals
    - sandbox
  annotations:
    aria.dev/tier: "{% if values.tier == 'tier2-approval' %}2-remediation{% else %}1-readonly{% endif %}"
    aria.dev/stage: sandbox
    aria.dev/agent-type: declarative
    aria.dev/model-config: ${{ values.modelConfig }}
    aria.dev/data-sensitivity: ${{ values.dataSensitivity }}
    aria.dev/eval: eval/${{ values.name }}.promptfooconfig.yaml
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/agents/${{ values.name }}/
  links:
    - url: https://github.com/guoxiangng/aria/tree/main/agents/${{ values.name }}
      title: Agent source
      icon: github
spec:
  type: kagent-agent
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: aria
  dependsOn:
    - resource:${{ values.modelConfig }}
    - resource:kagent-tool-server
{%- for callee in values.callsAgents %}
    - component:${{ callee }}
{%- endfor %}
