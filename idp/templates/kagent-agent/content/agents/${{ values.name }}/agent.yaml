# Generated by the Backstage onboarding template (idp/templates/kagent-agent/).
# Owner: ${{ values.owner }}. Edit freely — the template never touches this file again.
#
# The system message is COMPOSED by kagent, not written here: platform guardrails
# (platform/kagent/prompt-fragments.yaml, platform-owned) + this agent's own instructions
# (prompt.yaml next to this file, author-owned). Iterate on behaviour in prompt.yaml.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: ${{ values.name }}
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: aria
    aria.dev/tier: "{% if values.tier == 'tier2-approval' %}2-remediation{% else %}1-readonly{% endif %}"
    # sandbox until promoted (docs/spec-idp-golden-path.md §4) — promotion flips this label.
    aria.dev/stage: sandbox
    aria.dev/data-sensitivity: ${{ values.dataSensitivity }}
spec:
  type: Declarative
  description: ${{ values.purpose | dump }}
  declarative:
    modelConfig: ${{ values.modelConfig }}
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: aria-prompt-fragments
          alias: platform
        - kind: ConfigMap
          name: ${{ values.name }}-prompt
          alias: agent
    systemMessage: |
      You are ARIA's {{ .AgentName }} agent.

      {{ include "platform/base" }}
      {{ include "platform/{% if values.tier == 'tier2-approval' %}tier2-approval{% else %}tier1-readonly{% endif %}" }}
      {{ include "agent/instructions" }}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
{%- for tool in values.readTools %}
            - ${{ tool }}
{%- endfor %}
{%- if values.tier == 'tier2-approval' %}
{%- for tool in values.mutatingTools %}
            - ${{ tool }}
{%- endfor %}
          # Every mutating tool pauses for explicit human approve/reject. Platform rule: the
          # template adds ALL mutating tools here — the author cannot opt one out.
          requireApproval:
{%- for tool in values.mutatingTools %}
            - ${{ tool }}
{%- endfor %}
{%- endif %}
{%- for callee in values.callsAgents %}
      - type: Agent
        agent:
          apiGroup: kagent.dev
          kind: Agent
          name: ${{ callee }}
          namespace: kagent
{%- endfor %}
