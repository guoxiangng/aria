# Generated by the kagent-agent-onboarding Backstage template.
# Modeled on the real, live, enforcement-verified pattern:
#   platform/istio/policies/cluster-diagnostics-authz.yaml (single caller)
#   platform/istio/policies/mcp-servers-allow-list.yaml (multiple callers + the "both sides" rule)
#
# An AuthorizationPolicy with action: ALLOW makes its target DEFAULT-DENY at the mesh (ztunnel) -
# only requests whose mTLS peer SPIFFE identity matches a listed principal are permitted.
#
# "BOTH SIDES" REMINDER: this file lists who ${{ values.name }} is allowed to call FROM (i.e. who
# may call ${{ values.name }} - see the "from" block below is actually about INBOUND callers TO
# this agent, standard Istio AuthorizationPolicy semantics). If ${{ values.name }} itself needs to
# call an EXISTING agent (see "callsAgents" chosen at onboarding time), that EXISTING agent's own
# AuthorizationPolicy file needs THIS agent's principal added too - this template does not do that
# patch automatically. See the generated PR description for the exact files to check.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ${{ values.name }}-allow-list
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
{% if values.callsAgents and values.callsAgents.length > 0 %}
{% for caller in values.callsAgents %}
              # NOTE: this assumes ${{ caller }} calls ${{ values.name }} (a guess from "callsAgents"
              # being symmetric-ish) - VERIFY the actual call direction and edit if wrong. kagent's
              # own controller may also need a principal entry here if it health-checks this agent
              # directly (see mcp-servers-allow-list.yaml's kagent-controller entries for that
              # pattern with MCP servers).
              - cluster.local/ns/kagent/sa/${{ caller }}
{% endfor %}
{% else %}
              # No callers specified at onboarding time. This policy currently allows NOBODY
              # (default-deny with an empty allow-list) - add the real caller's principal here,
              # e.g.: cluster.local/ns/kagent/sa/incident-commander
              - cluster.local/ns/kagent/sa/CHANGE-ME
{% endif %}
