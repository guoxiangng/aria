# Generated by the Backstage onboarding template — what ${{ values.name }} may call.
#
# The "both sides" rule: an allow-list lives on the CALLEE, so letting ${{ values.name }} reach
# something means a policy on that something. Istio ORs every ALLOW policy on a workload, so each
# grant below is a NEW policy object rather than an edit to the callee's existing list — the
# template only ever adds files, and deleting this file revokes exactly this agent's reach.
---
# The model gateway. Without this the agent is reset at the mesh and reports a plain API error
# (strands-investigator, 2026-10-08).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: litellm-from-${{ values.name }}
  namespace: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/kagent/sa/${{ values.name }}
{%- for callee in values.callsAgents %}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ${{ callee }}-from-${{ values.name }}
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ callee }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/kagent/sa/${{ values.name }}
{%- endfor %}
