# Generated by the Backstage onboarding template — who may call ${{ values.name }}.
#
# ALLOW makes the agent default-deny at ztunnel: only these SPIFFE identities get through.
# kagent-controller is ALWAYS listed — it is the kagent UI's chat path (UI -> controller
# /api/a2a/... -> agent, under the controller's own identity). Leaving it off is exactly the
# 2026-10-08 bug: the agent reports Ready=True and every UI chat is reset.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ${{ values.name }}-inbound
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/kagent/sa/kagent-controller
{%- for caller in values.callers %}
              - cluster.local/ns/kagent/sa/${{ caller }}
{%- endfor %}
