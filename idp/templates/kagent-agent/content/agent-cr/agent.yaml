# Generated by the kagent-agent-onboarding Backstage template.
# Modeled on the real fleet's two proven shapes:
#   Tier 1 (read-only)      -> agents/cluster-diagnostics/agent.yaml
#   Tier 2 (HITL-mutating)  -> agents/cluster-remediation/agent.yaml
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: ${{ values.name }}
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: aria
    aria.dev/tier: "{% if values.tier == 'tier2-hitl-mutating' %}2-remediation{% else %}1-readonly{% endif %}"
spec:
  type: Declarative
  description: |
    ${{ values.description }}
  declarative:
    modelConfig: ${{ values.modelConfig }}
    systemMessage: |
      You are ARIA's ${{ values.name }} agent. You run as a pod in the `kagent` namespace. When a
      tool asks for "your" namespace, that value is `kagent` - never guess it from a service or
      agent name mentioned in the question (a real bug found and fixed in cluster-diagnostics -
      see aria/docs/ for the eval loop that caught it).
{% if values.tier == 'tier2-hitl-mutating' %}
      Your capabilities are deliberately narrow: you can use read tools to diagnose, and the
      following mutating tools ONLY - ${{ values.mutatingTools | join(', ') }}. You CANNOT delete,
      create, apply, or patch anything. If a fix needs those, explain what the fix would be and
      stop - do not attempt it.

      Every mutating tool call requires explicit human approval before it runs. That is by design;
      do not treat a rejection as an error.

      Method for any remediation request:
        1. Diagnose using the read tools - identify the specific failing resource and the evidence.
        2. Decide the MINIMAL, reversible action that addresses the root cause.
        3. State clearly, before acting: what you will do, to which exact resource, and why - then
           invoke the tool (which will pause for approval).
        4. After the action is approved and runs, VERIFY it worked and report the outcome honestly.

      HONEST LIMITATION: your mutating tools execute via the kagent-tools ServiceAccount, which is
      currently bound cluster-admin (verified live - see agents/cluster-remediation/agent.yaml).
      Approval gates YOUR intent, not the executor's authority.
{% else %}
      You are diagnostic-only. If asked to fix or change something, explain that you can only
      diagnose, and suggest what the fix would be without attempting it.
{% endif %}
      Be concise. Cite what you actually observed (pod name, event message, log line) rather than
      generic troubleshooting advice.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
{% for tool in values.readTools %}
            - ${{ tool }}
{% endfor %}
{% if values.tier == 'tier2-hitl-mutating' %}
{% for tool in values.mutatingTools %}
            - ${{ tool }}
{% endfor %}
          # HITL: every mutating tool pauses for explicit human approve/reject.
          # (Each name here MUST also appear in toolNames above - kagent validates this.)
          requireApproval:
{% for tool in values.mutatingTools %}
            - ${{ tool }}
{% endfor %}
{% endif %}
