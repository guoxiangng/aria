# ARIA software catalog — the Backstage entities for the existing fleet (P1 of
# docs/spec-idp-golden-path.md). One file on purpose: one GitHub fetch per refresh while the
# integration may still be unauthenticated (60 calls/hour).
#
# Seeded 2026-10-18 from the LIVE Agent / MCPServer CRs (descriptions, tier labels, modelConfig,
# tool and agent references), not typed from memory. Maintained by hand from here; new agents will
# arrive through the P2 template instead.
#
# Scorecard seed: each agent's `aria.dev/eval` annotation and its evals / no-evals tag say whether
# eval/ has a suite for it. BYO agents' dependsOn comes from their Deployment env (they read no
# ModelConfig or McpServer CR). The onboarding template is NOT registered here — see values.yaml.
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: aria
  title: ARIA
  description: Governed multi-agent InfraOps platform on EKS, built on kagent.
  links:
  - url: https://github.com/guoxiangng/aria
    title: Repository
    icon: github
spec:
  owner: group:platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform team
  description: Owns the ARIA platform and, for the POC, every agent on it.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: litellm
  description: 'Self-hosted LiteLLM proxy in front of Bedrock: enforced budgets, fallbacks, the smart router. The
    fleet''s single model plane.'
  annotations:
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/platform/litellm/
spec:
  type: model-gateway
  owner: group:platform-team
  system: aria
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: litellm-gateway
  description: Fixed route bedrock-haiku-4-5 through the gateway. What ARIA's own declarative agents use.
  annotations:
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/platform/kagent/
spec:
  type: model-config
  owner: group:platform-team
  system: aria
  dependsOn:
  - resource:litellm
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: litellm-smart-router
  description: Complexity Auto Router through the gateway; picks a tier per request. Not wired to an agent yet.
  annotations:
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/platform/kagent/
spec:
  type: model-config
  owner: group:platform-team
  system: aria
  dependsOn:
  - resource:litellm
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: litellm-embedding
  description: Cohere Embed v4 through the gateway, for long-term memory.
  annotations:
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/platform/kagent/
spec:
  type: model-config
  owner: group:platform-team
  system: aria
  dependsOn:
  - resource:litellm
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: default-model-config
  description: Chart-generated config the kagent built-in agents use; points at the gateway.
  annotations:
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/platform/kagent/
spec:
  type: model-config
  owner: group:platform-team
  system: aria
  dependsOn:
  - resource:litellm
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kagent-tool-server
  description: kagent's built-in Kubernetes/Helm/Istio tool server. Runs as cluster-admin — approval gates intent,
    not authority.
spec:
  type: mcp-server
  owner: group:platform-team
  system: aria
---
apiVersion: backstage.io/v1alpha1
