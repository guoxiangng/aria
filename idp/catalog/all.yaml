apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cloud-diagnostics
  description: ARIA's AWS control-plane diagnostician. Answers what AWS knows about the EKS cluster â€” insights,
    node groups, VPC/networking config, CloudWatch metrics and logs.
  tags:
  - aria
  - declarative
  - evals
  annotations:
    aria.dev/tier: 1-readonly
    aria.dev/agent-type: declarative
    aria.dev/model-config: litellm-gateway
    aria.dev/eval: eval/cloud-diagnostics.promptfooconfig.yaml
    backstage.io/source-location: url:https://github.com/guoxiangng/aria/tree/main/agents/cloud-diagnostics/
  links:
  - url: https://github.com/guoxiangng/aria/tree/main/agents/cloud-diagnostics
    title: Agent source
    icon: github
spec:
  type: kagent-agent
  lifecycle: production
  owner: group:platform-team
  system: aria
  dependsOn:
  - resource:litellm-gateway
  - resource:aws-eks
