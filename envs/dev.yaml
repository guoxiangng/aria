cluster: aria
platformTeamGroup: platform-team

namespaces:
  # kagent platform namespace — now pure CaC (moved off Terraform once its secrets went to ESO).
  # NO quota/limits block on purpose: this is the platform's own namespace with ~20 controller-managed
  # workloads (postgres, controller, agents, tools) — imposing a ResourceQuota/LimitRange could reject
  # future agent pods that don't declare matching requests. The chart's quota/limits are opt-in per
  # namespace (guarded by `{{ if .quota }}` / `{{ if .limits }}`), so omitting them here is intentional.
  # The `labels` block enrolls it into the Istio ambient mesh (per-agent SPIFFE identity + A2A mTLS).
  - name: kagent
    service: kagent
    env: dev
    labels:
      istio.io/dataplane-mode: ambient

  # ARIA custom agents (our InfraOps agents, later)
  - name: aria-agents-dev
    service: agents
    env: dev
    quota:
      requestsCpu: "2"
      requestsMemory: "4Gi"
      limitsCpu: "4"
      limitsMemory: "8Gi"
      pvcs: 5
      pods: 20
    limits:
      defaultCpu: "500m"
      defaultMemory: "512Mi"
      defaultRequestCpu: "100m"
      defaultRequestMemory: "128Mi"
      maxCpu: "2"
      maxMemory: "4Gi"

  # LiteLLM model gateway (platform/litellm/) — single lightweight Deployment, not a platform
  # namespace like kagent, so (unlike kagent) an explicit small quota is appropriate here.
  # Ambient-mesh-enrolled: gets its own SPIFFE identity, reachable only per
  # platform/istio/policies/litellm-allow-list.yaml.
  #
  # The quota must fit TWO pods even though only one runs. 2026-09-18: it was sized to exactly one
  # pod's limits (limits.cpu 1 / 1Gi), which silently made rolling updates impossible — a
  # RollingUpdate surges a second pod before retiring the first, so the replacement was rejected at
  # admission (`exceeded quota: compute-quota`), not merely left Pending. The gateway then sat with
  # no running pod at all and the whole fleet lost its model. Headroom here is not slack, it is what
  # makes the deployment updatable.
  - name: litellm
    service: litellm
    env: dev
    labels:
      istio.io/dataplane-mode: ambient
    quota:
      # 2026-09-26: raised again for the Postgres that backs budget enforcement. Sized for TWO
      # workloads plus a surge pod each, not for what is running right now — see the comment above:
      # a quota that exactly fits current pods is a quota that makes the next rollout impossible.
      # Memory raised 2026-09-26 (second pass): with DATABASE_URL set, LiteLLM loads Prisma at boot and
      # OOMKilled at 1Gi with zero log output — the only evidence was exitCode 137. It needs 2Gi. Totals
      # here must fit proxy(2Gi) + postgres(1Gi) + a 2Gi SURGE pod during a rollout = 5Gi, hence 6Gi.
      requestsCpu: "1"
      requestsMemory: "3Gi"
      limitsCpu: "4"
      limitsMemory: "6Gi"
      pvcs: 1
      pods: 5
    limits:
      defaultCpu: "250m"
      defaultMemory: "512Mi"
      defaultRequestCpu: "100m"
      defaultRequestMemory: "256Mi"
      # maxMemory must allow the proxy's 2Gi ceiling, or the LimitRange rejects the pod before the
      # quota ever sees it — two different admission gates, both capable of blocking a rollout.
      maxCpu: "1"
      maxMemory: "2Gi"

  # Actions Runner Controller (ARC) - CI infra, kept separate from agent/app namespaces
  # deliberately (isolation over convenience - see eval/README.md for the trade-off note).
  - name: arc-systems
    service: arc-controller
    env: dev
    quota:
      requestsCpu: "500m"
      requestsMemory: "512Mi"
      limitsCpu: "1"
      limitsMemory: "1Gi"
      pvcs: 0
      pods: 5
    limits:
      defaultCpu: "200m"
      defaultMemory: "256Mi"
      defaultRequestCpu: "100m"
      defaultRequestMemory: "128Mi"
      maxCpu: "1"
      maxMemory: "1Gi"

  - name: arc-runners
    service: arc-runners
    env: dev
    quota:
      requestsCpu: "1"
      requestsMemory: "2Gi"
      limitsCpu: "2"
      limitsMemory: "4Gi"
      pvcs: 0
      pods: 10
    limits:
      defaultCpu: "500m"
      defaultMemory: "1Gi"
      defaultRequestCpu: "250m"
      defaultRequestMemory: "512Mi"
      maxCpu: "2"
      maxMemory: "4Gi"
