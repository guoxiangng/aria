{{- range .Values.namespaces }}
{{- if .quota }}
---
# Quota is OPT-IN per namespace: tenant/agent namespaces set a `quota:` block; platform
# namespaces (e.g. kagent, which the platform controls directly) omit it and run unconstrained.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.cpu: {{ .quota.requestsCpu | quote }}
    requests.memory: {{ .quota.requestsMemory | quote }}
    limits.cpu: {{ .quota.limitsCpu | quote }}
    limits.memory: {{ .quota.limitsMemory | quote }}
    persistentvolumeclaims: {{ .quota.pvcs | default 10 | quote }}
    pods: {{ .quota.pods | default 20 | quote }}
{{- end }}
{{- end }}
