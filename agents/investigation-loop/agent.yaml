# BYO Agent CR — kagent's controller manages this Deployment but runs OUR container image
# (built from the Dockerfile in this folder), speaking A2A via kagent's official
# kagent-langgraph SDK (investigation_agent/cli.py + agent.py).
#
# NOTE: once this is committed, ArgoCD's `agents` Application (glob `*/*.yaml`) syncs it
# immediately. Until the image is actually built + pushed (infra/04-persistent/README.md),
# the pod will sit in ImagePullBackOff - expected and self-resolving, not a bug to chase.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: investigation-loop
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: aria
    aria.dev/tier: "2-byo"
spec:
  type: BYO
  description: |
    ARIA's stateful investigation agent (hand-built LangGraph, gather/hypothesize/verify/loop).
    Read-only tools only - see agents/investigation-loop/README.md.
  byo:
    deployment:
      image: 622629043701.dkr.ecr.ap-southeast-1.amazonaws.com/aria/investigation-loop:latest
      # Always, not IfNotPresent — this repo pushes to a mutable :latest tag during active
      # development. Without this, a node can silently keep running a stale cached image after
      # a rebuild+push, even after a pod restart (learned the hard way - same class of bug as
      # the GitLab-runner if-not-present trap in stories.md, just on a k8s node instead).
      imagePullPolicy: Always
      env:
        # NOTE: env `name` (what our code reads) intentionally differs from the secret's `key`
        # (AZUREOPENAI_API_KEY, no underscore - set by infra/03-argocd to match the chart's
        # providers block convention). This is a deliberate rename, not a typo.
        # Repointed at the LiteLLM gateway 2026-09-26. This agent had been dead:
        # the Azure resource it used no longer resolves on public DNS, so every
        # run ended `openai.APIConnectionError: Connection error.` Nothing
        # surfaced it, because kagent's Ready condition reports whether the
        # Deployment is up, not whether the agent can reach a model - the fleet
        # listed it Ready=True the whole time. Found by the refusal eval, which
        # could not get an answer out of it at all.
        #
        # The variable NAMES stay Azure-shaped on purpose. `AzureChatOpenAI`
        # (graph.py) calls `{endpoint}/openai/deployments/{deployment}/chat/
        # completions?api-version=...`, and LiteLLM serves exactly that
        # Azure-compatible route - verified live against the gateway with both
        # the `api-key` header this client sends and a bearer token. So this is
        # an env-only change: no code edit, no image rebuild, no ECR push.
        #
        # The key is now the gateway's key rather than an Azure key. It must be
        # the `litellm-gateway-key` copy that ESO materialises in THIS namespace:
        # `litellm-master-key` lives in the litellm namespace, and secretKeyRef
        # does not cross namespaces - referencing it left the pod unschedulable
        # with no pod at all, which presents as the same APIConnectionError as
        # before the fix. Same value, local copy.
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-gateway-key
              key: LITELLM_MASTER_KEY
        - name: AZURE_OPENAI_ENDPOINT
          value: "http://litellm.litellm.svc.cluster.local:4000"
        - name: AZURE_OPENAI_API_VERSION
          value: "2024-12-01-preview"
        # A LiteLLM model group, not an Azure deployment. Same one the
        # declarative fleet uses via default-model-config.
        - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
          value: "bedrock-haiku-4-5"
        - name: MCP_SERVER_URL
          value: "http://kagent-tools.kagent:8084/mcp"
