# BYO Agent CR — the Strands implementation of the same task as investigation-loop.
#
# Deliberate difference from investigation-loop/agent.yaml: the image (Strands
# instead of LangGraph). Both now take their model from the LiteLLM gateway, on the
# same route, so the framework is the only variable.
#
# Model: the gateway (MODEL_GATEWAY_URL), since 2026-10-08. It was Bedrock direct
# via EKS Pod Identity — no static key — until Sonnet 4.6 started failing with
# AccessDenied (`aws-marketplace:Subscribe` missing on the role) while the rest of
# the fleet, behind the gateway, was fine. Remove MODEL_GATEWAY_URL to go back to
# Bedrock direct (needs the Pod Identity association in infra/02-eks, which still
# exists). Requires this SA on platform/istio/policies/litellm-allow-list.yaml.
#
# NOTE: once committed, ArgoCD's `agents` Application (glob `*/*.yaml`) syncs this
# immediately. Until the image is built + pushed the pod sits in ImagePullBackOff —
# expected and self-resolving, not a bug to chase.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: strands-investigator
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: aria
    aria.dev/tier: "2-byo"
spec:
  type: BYO
  description: |
    ARIA's Strands-based investigation agent - same task as investigation-loop, but the
    loop is model-driven inside the Strands SDK rather than a hand-built graph.
    Read-only tools only - see agents/strands-investigator/README.md.
  byo:
    deployment:
      image: 622629043701.dkr.ecr.ap-southeast-1.amazonaws.com/aria/strands-investigator:latest
      # Mutable :latest during active development — see investigation-loop/agent.yaml
      # for why IfNotPresent silently serves stale images off a node cache.
      imagePullPolicy: Always
      env:
        - name: MCP_SERVER_URL
          value: "http://kagent-tools.kagent:8084/mcp"
        # A BYO agent never reads a ModelConfig CR — these mirror `litellm-gateway`
        # (platform/kagent/modelconfig-litellm.yaml) in the only place a BYO agent
        # can be told anything: its env.
        - name: MODEL_GATEWAY_URL
          value: "http://litellm.litellm.svc.cluster.local:4000/v1"
        - name: MODEL_GATEWAY_MODEL
          value: "bedrock-haiku-4-5"
        - name: MODEL_GATEWAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-gateway-key
              key: LITELLM_MASTER_KEY
