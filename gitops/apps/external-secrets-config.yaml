# Wave 1 — ESO configuration CRs (ClusterSecretStore now; the kagent ExternalSecrets
# land here at cutover). Separate from the wave-0 chart install so these CRs apply only
# after ESO's CRDs + controller exist. Directory source over platform/external-secrets/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/guoxiangng/aria.git
    targetRevision: main
    path: platform/external-secrets/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets # default for namespaced CRs that don't set their own; ExternalSecrets set namespace: kagent explicitly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
