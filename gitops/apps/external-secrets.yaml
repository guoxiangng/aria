# Wave 0 — External Secrets Operator (upstream OCI Helm chart + our values). Installs
# the ESO CRDs + controller. Same multi-source GitOps pattern as kagent/istio.
# The AWS backing (Secrets Manager secrets + Pod Identity IAM role for the controller SA)
# is provisioned by Terraform in infra/03-argocd/eso.tf.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/guoxiangng/aria.git
      targetRevision: main
      ref: values
    - repoURL: ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: "0.20.4" # pinned; verify latest via `helm show chart oci://ghcr.io/external-secrets/charts/external-secrets`
      helm:
        valueFiles:
          - $values/platform/external-secrets/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # external-secrets is system infra
      - ServerSideApply=true # ESO CRDs are large — avoid the client-side annotation limit
