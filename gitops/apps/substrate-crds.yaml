# Wave 0 — Agent Substrate CRDs (ate.dev: actortemplates, workerpools, sandboxconfigs).
# Upstream OCI chart, unmodified. Must land before the substrate control plane and before
# kagent enables substrate (wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/substrate/helm
    chart: substrate-crds
    targetRevision: "0.0.10" # pinned; verify latest at github.com/kagent-dev/substrate/releases
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
