# Publishes the ARIA product page (site/index.html) to GitHub Pages at
# https://guoxiangng.github.io/aria/ . The page is linked from the portfolio site
# (guoxiangng.github.io) as Project 2 — one page, lives only in this repo.
# Only index.html is committed under site/ (other drafts stay local, gitignored).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site # site/index.html becomes the site root -> served at /aria/
      - id: deployment
        uses: actions/deploy-pages@v4
