# ARIA kagent values — overlay on the UPSTREAM chart:
#   oci://ghcr.io/kagent-dev/kagent/helm/kagent
# Tuned for a single-node EKS lab. See README.md for install + the Bedrock provider decision.

# --- Controller ---
controller:
  replicas: 1
  agentDeployment:
    # Default SA for agent pods. Set this to the ServiceAccount that EKS Pod Identity binds to the
    # `aria-bedrock` IAM role, so agent pods get Bedrock via the AWS credential chain (no API key).
    # TODO: set once the agent-namespace / workload-sa convention is finalized.
    serviceAccountName: ""
  watchNamespaces: [] # watch all namespaces for now; scope down later
  # Langfuse auth for OTel export — the chart's otel.tracing.exporter has no `headers` field, but the
  # underlying Go OTel SDK falls back to this standard env var. UNVERIFIED until deploy (see README).
  env:
    - name: OTEL_EXPORTER_OTLP_HEADERS
      valueFrom:
        secretKeyRef:
          name: kagent-langfuse-otel
          key: OTEL_EXPORTER_OTLP_HEADERS
  # Agent Substrate (density/serverless actor runtime). Requires the `ate-system` control
  # plane (see platform/substrate/ + gitops/apps/substrate*.yaml). When enabled, the controller
  # translates SandboxAgent CRs (platform: substrate) into ActorTemplates scheduled on the
  # WorkerPool below — instead of one always-on Deployment per agent. Existing Declarative/BYO
  # agents (the fleet) are unaffected; this is additive.
  substrate:
    # Root cause found + fixed (2026-08-06): EKS node security group only opened ephemeral
    # ports (1025-65535) between nodes by default — ate-api's port 443 was unreachable
    # cross-node (not the mesh, not the cert). Fixed in infra/02-eks (node_security_group_
    # additional_rules, ingress_self_443). See platform/substrate/README.md.
    enabled: true
    ateApiEndpoint: "dns:///api.ate-system.svc:443"      # `api` svc, port 443 (verified live)
    atenetRouterURL: "http://atenet-router.ate-system.svc:80"
    ateApiInsecure: true   # spike: skip ate-api server-cert verify. Harden later with the
                           # chart's ateapi-ca ConfigMap (JWT-mode bootstrap serverCert).
    defaultWorkerPool:
      namespace: kagent
      name: kagent-default

# --- Agent Substrate WorkerPool: shared "platform capacity" the chart creates (not owned by
# any single agent). Actors (SandboxAgents) are scheduled onto these worker pods. One replica
# is enough for the lab. ateomImage is the gVisor worker image (verified: tag exists in GHCR). ---
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 1
  ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.10

# --- UI (set replicas: 0 to save resources if you only use CLI/API) ---
ui:
  replicas: 1

# --- Built-in agents: disable the ones this platform has no substrate for. ---
# The chart ships ~10 ready-made agents, each its own Deployment (a pod + CPU request). On a
# two-node lab that density is what actually bites: enabling pgvector wedged the Postgres pod
# into Pending ("Insufficient cpu" on one node, "Too many pods" on the other) until this was
# trimmed. These specific agents are dead weight HERE — ARIA runs AWS VPC CNI (no Cilium),
# has no kgateway and no Argo Rollouts, the grafana MCP has never registered (ACCEPTED=False,
# it points at a grafana.kagent service that doesn't exist), and querydoc is a docs-retrieval
# MCP nothing in the fleet queries. Re-enable any of them the day its backing system exists.
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
kgateway-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
grafana-mcp:
  enabled: false
querydoc:
  enabled: false
# TEMPORARY — re-enable together with grafana-mcp above.
# observability-agent's toolset references the grafana-mcp RemoteMCPServer, so disabling that server
# alone left this agent Accepted=False ("RemoteMCPServer kagent-grafana-mcp not found") even though its
# Deployment stayed Ready. Both are off until there is an actual Grafana to point at — grafana-mcp
# defaults to grafana.kagent:3000, which does not exist in this cluster, which is why it never
# registered. NOTE: this agent is wanted for the observability articles; turning it back on means
# standing up Grafana (or pointing grafana-mcp at a real endpoint) and flipping BOTH flags.
observability-agent:
  enabled: false

# --- Database: bundled PostgreSQL is dev-only (fine for the lab) ---
database:
  postgres:
    # Enables the pgvector migration, which kagent's INTERNAL long-term memory depends on
    # (agent `spec.declarative.memory`). Note this is a different feature from the standalone
    # `Memory` CR, whose only provider is Pinecone (external SaaS) — the internal path keeps
    # memory self-hosted in the bundled Postgres instead. Ships disabled upstream.
    vectorEnabled: true
    bundled:
      enabled: true
      storage: 500Mi
      # storageClassName: gp2   # EKS default; leave empty to use cluster default
      # The chart's default bundled image is stock `postgres` (docker.io/library/postgres:18.3-alpine),
      # which does NOT carry the pgvector extension — verified live: `vector` wasn't even listed in
      # pg_available_extensions, so `vectorEnabled: true` alone cannot work with the default image.
      # pgvector/pgvector is the official pgvector build of the same Postgres major version (18), so
      # the existing PVC's data directory stays compatible — this is an image swap, not a migration.
      image:
        registry: docker.io
        repository: pgvector
        name: pgvector
        tag: "pg18"

# --- LLM providers ---
# Azure OpenAI via the chart's providers block (known-good) -> becomes `default-model-config`.
# Bedrock is applied separately as its own ModelConfig CRs (modelconfig-bedrock.yaml). See README.
providers:
  default: azureOpenAI
  azureOpenAI:
    provider: AzureOpenAI
    model: "gpt-5.4-mini-ncs4-group4" # deployment name (kagent uses this as the model id for Azure)
    apiKeySecretRef: kagent-azure-openai # secret created by infra/03-argocd (key NOT committed)
    apiKeySecretKey: AZUREOPENAI_API_KEY
    config:
      apiVersion: "2024-12-01-preview"
      azureDeployment: "gpt-5.4-mini-ncs4-group4"
      azureEndpoint: "https://oai-ladp-ncs-4.openai.azure.com"

# --- Built-in agents: enable the InfraOps-relevant ones; disable mesh/CNI we don't run on EKS ---
agents:
  k8s-agent: { enabled: true }
  observability-agent: { enabled: true }
  promql-agent: { enabled: true }
  helm-agent: { enabled: true }
  argo-rollouts-agent: { enabled: true }
  kgateway-agent: { enabled: false }
  istio-agent: { enabled: false }
  cilium-policy-agent: { enabled: false }
  cilium-manager-agent: { enabled: false }
  cilium-debug-agent: { enabled: false }

# --- Built-in tools ---
kagent-tools:
  enabled: true
tools:
  grafana-mcp: { enabled: false } # enable at the observability rung (needs Grafana)
  querydoc: { enabled: false }

# --- OTel → Langfuse (US region; team's LADP account). Traces only for now (logging off). ---
otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        # kagent injects this as OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (signal-specific), which per the
        # OTel spec is NOT auto-suffixed — Langfuse's own docs say to include /v1/traces explicitly here.
        endpoint: "https://us.cloud.langfuse.com/api/public/otel/v1/traces"
        protocol: "http/protobuf" # Langfuse OTLP is HTTP-only (no gRPC) — chart default is grpc
        timeout: 15000
        insecure: false
  logging:
    enabled: false
