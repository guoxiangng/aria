# ARIA overlay for the (vendored, patched) Agent Substrate chart.
#   chart: platform/substrate/vendor/substrate  (upstream v0.0.10 + the ARIA valkey patch — see PATCH.md)
# Everything ARIA-specific lives here; the vendored chart stays at upstream defaults
# except the one parameterizing patch. Keep this overlay thin.

# --- Auth: JWT mode backed by projected K8s SA tokens (default). The ONE EKS-specific
# knob: point the issuer at THIS cluster's OIDC issuer (upstream default assumes the
# stock kind/kubeadm issuer). Verified live:
#   aws eks describe-cluster --name aria --query cluster.identity.oidc.issuer
# gVisor/actor isolation + no PodCertificate feature-gates needed on EKS in jwt mode.
auth:
  mode: jwt
  jwt:
    issuer: https://oidc.eks.ap-southeast-1.amazonaws.com/id/4EFBE072411043FBC822ACD19BB625DD
    audience: api.ate-system.svc
    # Do NOT let the chart self-bootstrap the server cert / session pools. Its bootstrap uses
    # Helm `lookup` to reuse material, which returns empty under ArgoCD's `helm template` -> it
    # would regenerate certs every sync. Instead ARIA provides all four objects (ateapi-tls,
    # ateapi-ca, session-id-{jwt,ca}-pool) via ESO from Secrets Manager (material generated by
    # infra/03-argocd/substrate-certs.tf; ExternalSecrets in manifests/). See README.md.
    bootstrap:
      enabled: false

# --- Valkey (Redis Cluster) sizing. Upstream ships 6 (3 masters + 3 replicas) and
# HARDCODES that in the init job. The vendored chart parameterizes it (PATCH.md); here
# we run the minimum viable cluster for a lab: 3 masters, 0 replicas (no HA).
# This keeps the whole Substrate control plane on ARIA's 2x t3.large without a 3rd node
# (the binding constraint is VPC-CNI pod-slots/35-per-node, not CPU — valkey is best-effort).
valkey:
  enabled: true
  replicas: 3
  clusterReplicas: 0
  storageSize: 1Gi

# --- Snapshot store: keep the bundled in-cluster rustfs (S3-compatible). No AWS S3
# bucket or IAM needed for the spike — external S3 is a later hardening step.
rustfs:
  enabled: true
  storageSize: 1Gi
