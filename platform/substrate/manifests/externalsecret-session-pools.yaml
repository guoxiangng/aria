# Session-id signing pools for ate-api (--session-id-jwt-pool / --session-id-ca-pool).
# Each is a single `pool` key holding the exact JSON the chart's jwt-bootstrap builds
# (Authorities[] / CAs[]); mounted as pool.json. Material from substrate-certs.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session-id-jwt-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: session-id-jwt-pool
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pool
      remoteRef: { key: aria/substrate-session-jwt-pool, property: pool }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session-id-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: session-id-ca-pool
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pool
      remoteRef: { key: aria/substrate-session-ca-pool, property: pool }
