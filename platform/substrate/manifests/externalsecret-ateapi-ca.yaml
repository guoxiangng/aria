# CA bundle that ate-controller + atenet-router use to verify the ate-api server cert
# (--ateapi-ca-file). Upstream ships this as a ConfigMap (auth.jwt.caBundleConfigMap); ARIA
# delivers it as a Secret via ESO instead, so ALL cert material flows through one path
# (TF -> Secrets Manager -> ESO) and stays consistent on a fresh cluster. The two consumers
# are patched to mount this Secret in place of the ConfigMap (see vendor/PATCH.md).
# ca.crt is a public cert (no secret material) but rides along in the same SM secret as the
# server cert so the CA/leaf pair can never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ateapi-ca
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ateapi-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef: { key: aria/substrate-ateapi-tls, property: ca.crt }
