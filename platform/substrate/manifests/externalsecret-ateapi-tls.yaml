# ate-api JWT-mode server cert. Replaces the chart's self-bootstrapped ateapi-tls Secret
# (disabled via auth.jwt.bootstrap.enabled=false). Material generated + stored by
# infra/03-argocd/substrate-certs.tf. No secret material in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ateapi-tls
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ateapi-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls # match the chart's Secret type
  data:
    - secretKey: tls.crt
      remoteRef: { key: aria/substrate-ateapi-tls, property: tls.crt }
    - secretKey: tls.key
      remoteRef: { key: aria/substrate-ateapi-tls, property: tls.key }
