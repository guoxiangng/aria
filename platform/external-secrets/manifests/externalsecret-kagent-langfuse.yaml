# Replaces the Terraform-owned kagent-langfuse-otel Secret with a git-committed pointer.
# The value (a composed Langfuse OTLP Basic-Auth header) lives in Secrets Manager; this CR
# carries no material. Name + key identical to the old TF secret so the kagent controller's
# OTEL_EXPORTER_OTLP_HEADERS env (secretKeyRef) resolves unchanged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-langfuse-otel
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kagent-langfuse-otel
    creationPolicy: Owner
    deletionPolicy: Retain # explicit ESO defaults, kept in git so ArgoCD sees no drift
  data:
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef:
        key: aria/kagent-langfuse-otel
        property: OTEL_EXPORTER_OTLP_HEADERS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
