# The GitHub token ARC uses to register runners (platform/arc/runner-values.yaml: githubConfigSecret).
#
# Was a hand-made `kubectl create secret` until 2026-11-01, the one Secret a cluster rebuild could not
# restore. Backing secret + ESO read grant: infra/04-persistent/secrets.tf (aws_secretsmanager_secret.arc_gha_pat).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-gha-pat
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: arc-gha-pat
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_token
      remoteRef:
        key: aria/arc-gha-pat
        property: github_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
