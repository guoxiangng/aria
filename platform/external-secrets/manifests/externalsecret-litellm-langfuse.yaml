# LiteLLM's native Langfuse SDK callback (litellm_settings.success_callback: [langfuse] in
# platform/litellm/configmap.yaml) wants LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY split — a
# different shape than kagent's kagent-langfuse-otel secret, which holds one composed OTLP
# Basic-Auth header. Same Langfuse project (`aria`), two instrumentation paths in. Backing infra:
# infra/03-argocd/eso.tf (aws_secretsmanager_secret.litellm_langfuse, TF-seeded from the same
# langfuse_public_key/secret_key tfvars that already feed the OTLP header).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-langfuse
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-langfuse
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: aria/litellm-langfuse
        property: LANGFUSE_PUBLIC_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: aria/litellm-langfuse
        property: LANGFUSE_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
