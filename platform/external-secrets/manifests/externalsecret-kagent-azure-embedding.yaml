# Azure OpenAI EMBEDDING key, materialized from Secrets Manager by ESO.
# Separate from kagent-azure-openai (the CHAT key): kagent Memory vectorizes what it stores
# via a ModelConfig backed by an embedding deployment (text-embedding-3-large), which has its
# own credential on the same Azure resource.
#
# Contains NO secret material — just a pointer to aria/kagent-azure-embedding. Backing infra:
# infra/03-argocd/eso.tf (the secret + the ESO IAM read grant, which is ARN-scoped: a new
# ExternalSecret without its ARN added there fails with AccessDenied).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-azure-embedding
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kagent-azure-embedding
    creationPolicy: Owner
    deletionPolicy: Retain # explicit ESO defaults, kept in git so ArgoCD sees no drift
  data:
    - secretKey: AZUREOPENAI_EMBEDDING_API_KEY
      remoteRef:
        key: aria/kagent-azure-embedding
        property: AZUREOPENAI_EMBEDDING_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
