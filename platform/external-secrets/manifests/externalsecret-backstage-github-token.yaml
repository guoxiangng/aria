# Backstage's GitHub token (idp/), materialized from Secrets Manager by ESO. Two uses: authenticated
# catalog reads (lifts the 60 calls/hour unauthenticated cap) and, from P2, the scaffolder's
# publish:github:pull-request — creating a branch and opening a PR against aria. That is exactly
# the scope aria/github-pat-write already has (contents + PR write, aria repo only).
#
# REUSES aria/github-pat-write rather than a dedicated token — a POC trade-off, chosen 2026-10-18:
#   + no new token, no Terraform change, and the scope matches exactly
#   - shared with infra-author's write path (paused since 2026-09-26): revoking one revokes both
#   - not "one token per consumer". A production IDP would get its own token, or a GitHub App,
#     with independent rotation.
# PRs show the token owner as author either way — a fine-grained PAT acts as its user.
#
# Contains NO secret material — just a pointer. The ESO IAM read grant on aria/github-pat-write
# already exists (infra/03-argocd/eso.tf). Consumed by idp/backstage/values.yaml as an optional
# env var, so Backstage also runs without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-token
  namespace: idp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backstage-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: aria/github-pat-write
        property: GITHUB_PERSONAL_ACCESS_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
