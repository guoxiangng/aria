# Replaces the Terraform-owned kagent-azure-openai Secret with a git-committed pointer.
# Contains NO secret material — just "materialize the k8s Secret 'kagent-azure-openai' in
# kagent, key AZUREOPENAI_API_KEY, from Secrets Manager aria/kagent-azure-openai". ESO owns
# the resulting Secret. Name + key are identical to the old TF secret so agents consume it
# unchanged (validated byte-for-byte before cutover).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-azure-openai
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kagent-azure-openai
    creationPolicy: Owner
  data:
    - secretKey: AZUREOPENAI_API_KEY
      remoteRef:
        key: aria/kagent-azure-openai
        property: AZUREOPENAI_API_KEY
