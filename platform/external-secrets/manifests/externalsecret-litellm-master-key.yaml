# LiteLLM proxy's own admin/master key (general_settings.master_key in configmap.yaml, read from
# this env at container start). Container-only pattern (like github-pat): Terraform creates the
# Secrets Manager container only (aws_secretsmanager_secret.litellm_master_key in
# infra/03-argocd/eso.tf) — the value is seeded out-of-band via CLI so it never passes through
# tfvars or TF state. See eso.tf's comment for the exact `put-secret-value` command.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: aria/litellm-master-key
        property: LITELLM_MASTER_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
