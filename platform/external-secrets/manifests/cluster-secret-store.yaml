# Tells ESO HOW to reach AWS Secrets Manager. Cluster-scoped so any namespace's
# ExternalSecret can reference it. No `auth` block: with EKS Pod Identity the AWS SDK
# picks up credentials from ESO's controller ServiceAccount automatically (the binding
# lives in infra/04-persistent/secrets.tf). Least-privilege is enforced on the IAM side — that
# role can read only the two aria/* secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
