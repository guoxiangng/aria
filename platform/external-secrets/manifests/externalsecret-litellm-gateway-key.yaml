# Same aria/litellm-master-key Secrets Manager secret as externalsecret-litellm-master-key.yaml,
# materialized a SECOND time here in the `kagent` namespace — Kubernetes Secrets are
# namespace-scoped, and platform/kagent/modelconfig-litellm.yaml's apiKeySecret must resolve in
# `kagent` (where agent pods run), not `litellm` (where the proxy itself runs). One SM secret, two
# ExternalSecret pointers, no new IAM grant (same ARN already covers both).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-gateway-key
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-gateway-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: aria/litellm-master-key
        property: LITELLM_MASTER_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
