# GitHub PAT, materialized from Secrets Manager by ESO. Backs the self-hosted github-mcp-server
# (platform/mcp/github/) — a genuinely different secret than everything else here: it's a static
# bearer token GitHub issues, not a federated cloud credential like the EKS Pod Identity roles
# every AWS-facing workload in ARIA uses. There's no keyless equivalent on GitHub's side for a
# self-hosted server, so this is the one credential in the platform that has to be rotated by
# hand rather than assumed automatically.
#
# Contains NO secret material — just a pointer to aria/github-pat. Backing infra:
# infra/03-argocd/eso.tf (the secret + the ESO IAM read grant, ARN-scoped).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pat
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: github-pat
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_PERSONAL_ACCESS_TOKEN
      remoteRef:
        key: aria/github-pat
        property: GITHUB_PERSONAL_ACCESS_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
