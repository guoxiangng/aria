# The WRITE-capable GitHub PAT, materialized from Secrets Manager by ESO. Backs the second
# github-mcp-server (platform/mcp/github-write/), which is what infra-author uses to open a
# branch and a pull request.
#
# Deliberately a SEPARATE secret from `github-pat` rather than widening that one. The read-only
# server is wired into six agents; the write-capable one into exactly one. Sharing a token would
# hand write reach to every agent that only ever needed to read, and the blast radius of a leak
# would be the union rather than the smaller half. Two tokens, two scopes, two rotations.
#
# Contains NO secret material — just a pointer to aria/github-pat-write. Backing infra:
# infra/03-argocd/eso.tf (the secret + the ESO IAM read grant, ARN-scoped).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pat-write
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: github-pat-write
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_PERSONAL_ACCESS_TOKEN
      remoteRef:
        key: aria/github-pat-write
        property: GITHUB_PERSONAL_ACCESS_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
