# Postgres password for the gateway's own database (platform/litellm/postgres.yaml).
#
# The database exists because LiteLLM enforces budgets only when one is connected — its own source:
# "the budget will NOT be enforced and requests will never be blocked. Set DATABASE_URL". Verified
# empirically before building this: max_budget, provider_budget_config and rpm all accepted the config
# and blocked nothing without it.
#
# Two keys from one Secrets Manager entry: the raw password for Postgres itself, and a composed
# DATABASE_URL for the proxy, so the URL is never assembled in a manifest where it would be readable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-postgres
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgresql://litellm:{{ .POSTGRES_PASSWORD }}@litellm-postgres.litellm.svc.cluster.local:5432/litellm"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: aria/litellm-postgres
        property: POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
