# Reuses the EXISTING aria/kagent-azure-openai Secrets Manager secret — same Azure OpenAI resource
# kagent's own default-model-config already calls. No new secret, no new IAM grant (its ARN is
# already in infra/03-argocd/eso.tf's eso_read policy via aws_secretsmanager_secret.kagent_azure).
# Only the LOCAL key name differs: LiteLLM's Azure provider reads AZURE_API_KEY (its own env var
# convention), not AZUREOPENAI_API_KEY (kagent's). Same secret value, two consumers, two names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-azure
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-azure
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AZURE_API_KEY
      remoteRef:
        key: aria/kagent-azure-openai
        property: AZUREOPENAI_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
