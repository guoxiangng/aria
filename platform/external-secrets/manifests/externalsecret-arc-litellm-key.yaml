# The gateway key, materialised into arc-runners for the eval judge.
#
# A deliberate second copy of the same AWS secret, not a reference: ExternalSecret targets are
# namespaced and a secretKeyRef cannot cross namespaces, so the CI runner needs its own. The same
# pattern already applied to the Azure key this replaces.
#
# Why it replaces that key: the eval judge used to call Azure OpenAI directly. It routes through
# the LiteLLM gateway now (domain 10), and Azure was deleted in September - so the runner was left
# holding a credential for a service that no longer exists, and `run-all.sh` requires
# LITELLM_API_KEY, which nothing supplied. That is why the in-cluster gate could not pass.
#
# No Terraform change needed: aria/litellm-master-key is already in the ESO read grant
# (infra/03-argocd/eso.tf), because the litellm namespace consumes the same secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: aria/litellm-master-key
        property: LITELLM_MASTER_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
