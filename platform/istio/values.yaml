# Istio ambient mode — the identity/mesh layer for ARIA.
#
# WHY ambient (not sidecar): no per-pod proxy injection; a per-node ztunnel provides
# automatic mTLS + SPIFFE identity + L4 authorization for agent-to-agent (A2A) traffic
# with zero changes to the agent pods themselves. This is what lets ARIA add a real
# identity plane on top of the existing fleet without redeploying any agent.
#
# WHY the `ambient` umbrella chart (one release) rather than 4 separate charts
# (base/istiod/cni/ztunnel): a single ArgoCD Application, one pinned version, reproducible
# in a fresh cluster in one sync. Istio recommends separate charts only when you need
# independent control-plane/data-plane upgrade cadence — an ops-maturity concern that
# doesn't apply to this platform.
#
# EKS-SPECIFIC NOTES (verified live against this cluster, 2026-07):
#   - CNI: AWS VPC CNI (aws-node). istio-cni CHAINS onto it (does not replace it) — no CNI
#     swap needed. Ambient is GA and tested on EKS + VPC CNI.
#   - POD_SECURITY_GROUP_ENFORCING_MODE=standard is NOT needed here: this cluster does not
#     use Pod Security Groups (ENABLE_POD_ENI=false, zero SecurityGroupPolicy resources).
#     That workaround only applies with ENI trunking + pod-attached SGs — re-check if that
#     ever changes.
#   - Inter-node HBONE traffic uses port 15008. Managed node groups share the cluster
#     security group (self-referencing allow-all within the SG), so this is permitted by
#     default. If ztunnel mTLS between agents on different nodes ever fails, confirm the
#     node SG allows 15008 node-to-node first.
#
# The chart already defaults istiod / ztunnel / cni to the `ambient` profile; this file is
# intentionally thin — explicit intent + a home for EKS overrides, not a re-statement of
# chart defaults.

global:
  # distroless variant is the chart default; pinned here for reproducibility/intent.
  variant: distroless

# REQUESTS right-sized 2026-11-01. The chart defaults are sized for big clusters (its own comment:
# ztunnel's 512Mi is "enough for ~200k pod cluster"). Here the mesh reserved 1.4 cores + 3.8Gi —
# nearly as much as the 26 kagent pods — while using ~15m CPU and ~150Mi in total. Requests are what
# the scheduler packs by, so they were a big part of why a third node was needed. Each value below is
# ~5-10x measured use (kubectl top, 2026-11-01); no limits are set, so a burst can still use the node.
# ztunnel and istio-cni run once PER NODE, so every node added used to cost 300m of reservations.
istiod:
  enabled: true
  profile: ambient
  resources:
    requests:
      cpu: 50m       # used ~3m
      memory: 256Mi  # used ~46Mi

ztunnel:
  profile: ambient
  resources:
    requests:
      cpu: 20m       # used ~3-4m per node
      memory: 64Mi   # used ~6-13Mi per node

cni:
  profile: ambient
  resources:
    requests:
      cpu: 10m       # used ~1m per node
      memory: 64Mi   # used ~18-38Mi per node
