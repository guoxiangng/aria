# Allow-list for the self-hosted GitHub MCP server (platform/mcp/github/).
#
# First shipped DENY-BY-DEFAULT (empty rules), before any agent existed to reference this
# server — applying the lesson learned the hard way with the AWS servers (see
# mcp-servers-allow-list.yaml's header): a throwaway probe pod running as the `default`
# ServiceAccount reached aws-documentation because no policy existed yet to stop it. Now that
# deploy-diagnostics (agents/deploy-diagnostics/) is the one agent wired to this server, its
# principal is added HERE, in the same commit — not after. Worth being deliberate about here
# specifically: this server holds a real (if read-only-scoped) GitHub credential.
#
# GOTCHA, verified against Istio's docs (easy to get backwards, kept for the next server added):
#   rules: []      <- deny-all (THIS policy). Zero rules means nothing ever matches ALLOW.
#   rules: [{}]    <- allow-all. One EMPTY RULE OBJECT always matches. Opposite meaning,
#                     one pair of braces apart. Do not "simplify" this to rules: [{}].
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: github-allow-list
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: github
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # the only agent whose CR references this server (kind: MCPServer, name: github)
              - cluster.local/ns/kagent/sa/deploy-diagnostics
