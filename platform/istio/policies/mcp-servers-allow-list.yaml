# Identity-based allow-lists for the self-hosted MCP tool servers (platform/mcp/).
#
# WHY THIS EXISTS — the gap it closes:
# An Agent CR's `tools[].mcpServer.toolNames` decides which tools the LLM is *offered*. It is a
# configuration constraint on the agent's intent — NOT a network boundary. Until this policy, any
# pod that could route to `aws-eks.kagent:3000` could call all 16 of its AWS tools regardless of
# what any Agent CR said. Verified accidentally: a throwaway `kubectl run` probe pod running as the
# `default` ServiceAccount reached aws-documentation (seen in ztunnel logs as
# src.identity=.../sa/default). Same class of gap as kagent-tools' cluster-admin binding —
# configuration constrains *intent*, identity+policy constrains *authority*.
#
# WHO IS ALLOWED — derived from real ztunnel access logs, not assumption:
#   - The specific agent(s) whose Agent CR references that server, AND `kagent-controller`.
#
#   - CORRECTED 2026-08-21 — kagent-controller MUST be listed. An earlier version of this file
#     omitted it, on the belief (stated confidently in the comment, and wrong) that a direct
#     `kind: MCPServer` reference means the controller never connects. It does connect: kagent runs
#     a dedicated MCPServerToolController that reconciles EVERY MCPServer by calling `initialize`
#     against it to fetch its tool list, independent of how any Agent references it. Denying it put
#     all four servers into a permanent reconcile-error loop:
#         "failed to upsert tool server for mcp server" ... mcpServer":"kagent/github"
#         ... rejected by transport: Post "http://github.kagent:3000/mcp": read: connection reset by peer
#     Agents kept working throughout (they connect as themselves, and were allow-listed), which is
#     exactly why this went unnoticed — the break was in the controller's tool registry, not the
#     data path.
#
#     HOW THE WRONG CONCLUSION WAS REACHED — worth recording, because the method was the bug:
#     ztunnel is a DaemonSet (one pod per node). The "proof" was `kubectl logs ztunnel-<one-pod>`
#     grepped for these services, which returned nothing. That pod was simply on a different node
#     than the controller. Always use `-l app=ztunnel --prefix` to search the whole DaemonSet;
#     a single-pod grep proves nothing about cluster-wide traffic.
#
# MAINTENANCE NOTE (the "both sides" rule): wiring a new agent to an MCP server means editing TWO
# things — the Agent CR's tools list AND this file's principal list for that server. If you only do
# the first, the agent gets the tool in its prompt and then gets connection-reset at the mesh.
# That coupling is deliberate: granting a capability should be an explicit, reviewable change.
#
# Ambient note: `action: ALLOW` makes each target DEFAULT-DENY — only listed principals pass; all
# else is refused at the node ztunnel before reaching the pod. Kubelet health probes bypass ztunnel
# enforcement, so readiness/liveness are unaffected.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aws-pricing-allow-list
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-pricing
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # the only agent whose CR references this server (kind: MCPServer, name: aws-pricing)
              - cluster.local/ns/kagent/sa/cost-sentinel
              # required: MCPServerToolController fetches this server's tool list every reconcile
              - cluster.local/ns/kagent/sa/kagent-controller
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aws-documentation-allow-list
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-documentation
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # cluster-diagnostics uses this to ground remediation advice in real AWS docs.
              - cluster.local/ns/kagent/sa/cluster-diagnostics
              # required: MCPServerToolController fetches this server's tool list every reconcile
              - cluster.local/ns/kagent/sa/kagent-controller
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aws-eks-allow-list
  namespace: kagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-eks
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # cloud-diagnostics is the ONLY agent granted the AWS control-plane view, and its
              # Agent CR further narrows to 7 read-only tools (the server still advertises
              # mutating ones — see agents/cloud-diagnostics/agent.yaml). This server carries 16
              # AWS tools against a real (read-only) IAM role, so keep this list tight.
              - cluster.local/ns/kagent/sa/cloud-diagnostics
              # required: MCPServerToolController fetches this server's tool list every reconcile
              - cluster.local/ns/kagent/sa/kagent-controller
