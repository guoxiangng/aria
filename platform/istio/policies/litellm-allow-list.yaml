# Identity allow-list for the LiteLLM model gateway (platform/litellm/) — domain 10.
#
# WHY: same gap class as mcp-servers-allow-list.yaml — a kagent ModelConfig's baseUrl is a
# configuration pointer, not a network boundary. Without this, any pod in the mesh could reach
# litellm.litellm:4000 and, if it also had the master key, call Bedrock through it directly.
#
# WHO IS ALLOWED: every agent in the fleet, as of 2026-09-18. It was cost-sentinel alone until the
# Azure OpenAI resource was removed and the whole declarative fleet lost its model; the fleet was
# repointed at litellm-gateway, so the gateway is now the single model plane rather than one agent's
# experiment. The "both sides" rule from mcp-servers-allow-list.yaml applies here too: giving an
# agent `modelConfig: litellm-gateway` without adding its SA below gets it connection-reset at the
# mesh, and the agent will report the failure as a plain API error.
#
# UNLIKE the MCP-server allow-lists, kagent-controller is deliberately NOT listed here — verify
# this stays true after any kagent version bump (`kagent-kmcp-controller-manager` reconciles
# MCPServer via an `initialize` call at apply time; ModelConfig has no equivalent controller-side
# call to the endpoint — it's read by the agent pod itself, at inference time, not by the
# controller). If a future kagent version starts validating ModelConfig endpoints server-side,
# this comment is the tripwire to catch it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: litellm-allow-list
  namespace: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/kagent/sa/cost-sentinel
              - cluster.local/ns/kagent/sa/cluster-diagnostics
              - cluster.local/ns/kagent/sa/cloud-diagnostics
              - cluster.local/ns/kagent/sa/deploy-diagnostics
              - cluster.local/ns/kagent/sa/incident-commander
              - cluster.local/ns/kagent/sa/cluster-remediation
              - cluster.local/ns/kagent/sa/infra-author
              - cluster.local/ns/kagent/sa/substrate-probe
              - cluster.local/ns/kagent/sa/agent-sandbox-probe
