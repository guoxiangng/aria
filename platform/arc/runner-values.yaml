# The actual runner pool for github.com/guoxiangng/aria. Scales 0 -> maxRunners based on
# queued jobs (min 0 = no idle compute cost when nothing's running).
#
# githubConfigSecret references a pre-created K8s Secret (NOT committed here) - create it
# with: kubectl create secret generic arc-gha-pat -n arc-runners --from-literal=github_token='ghp_...'
# See eval/README.md for the full runbook.
githubConfigUrl: "https://github.com/guoxiangng/aria"
githubConfigSecret: arc-gha-pat

runnerScaleSetName: "aria-runners"
minRunners: 0
maxRunners: 2

# This chart auto-discovers the controller's ServiceAccount via a Helm `lookup()` call on
# arc-controller's Deployment label - but `lookup()` only works under `helm install/upgrade`,
# never `helm template`, and ArgoCD renders exclusively via `helm template` (for clean
# diff/prune). So auto-discovery can never succeed under ArgoCD regardless of whether the
# controller exists - set it explicitly instead (values confirmed from the live controller
# Deployment's own labels: actions.github.com/controller-service-account-{name,namespace}).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

# Plain mode (no dind/kubernetes containerMode) - the eval workflow only needs to checkout
# code and run promptfoo directly against in-cluster Service DNS, no nested container builds.
#
# Custom image (runner.Dockerfile, this folder) with Node.js + promptfoo pre-baked in - a
# fresh `npm install promptfoo` (571 transitive packages) on the plain actions-runner image
# measured hanging past 20 minutes under this pod's CPU limits. Built/pushed manually
# (infrequent - only when bumping the promptfoo version), not part of any CI pipeline.
template:
  spec:
    containers:
      - name: runner
        image: 622629043701.dkr.ecr.ap-southeast-1.amazonaws.com/aria/eval-runner:ci-runner
        # Always, not the IfNotPresent default for a non-`:latest` tag - this tag is mutable
        # (rebuilt in place when bumping promptfoo's version), same class of gotcha already
        # documented in agents/investigation-loop/agent.yaml. Without this, a node that
        # cached a broken build can keep serving it silently after a fresh push.
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          # The eval judge's credential. Routes through the LiteLLM gateway (domain 10),
          # NOT Azure directly - that was the old arrangement and Azure was deleted in
          # September, which left this runner holding a key to nothing while run-all.sh
          # required LITELLM_API_KEY that nothing supplied. That is why the in-cluster
          # gate could not pass regardless of how the agents behaved.
          #
          # Namespace isolation (arc-runners, separate from litellm) means this secret is a
          # deliberate duplicate, not a reference - secretKeyRef cannot cross namespaces.
          # Materialised by platform/external-secrets/manifests/externalsecret-arc-litellm-key.yaml.
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-master-key
                key: LITELLM_MASTER_KEY
