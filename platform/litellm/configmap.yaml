# LiteLLM's config.yaml. DB-less (see README.md "Key decisions"): one master key, no per-key budgets
# (those need general_settings.database_url — a Postgres LiteLLM manages via its own migrations-job,
# deliberately not run here). Per-tenant attribution comes from the request's `user` field, read back
# in Langfuse — see README.md's verification section.
#
# 2026-09-18: ALL-BEDROCK. The Azure OpenAI resource is gone — oai-ladp-ncs-4.openai.azure.com now
# returns NXDOMAIN from inside the cluster, so it isn't a revoked key, the resource itself was
# removed. Every Azure route here was dead, including the one the v1 `litellm-gateway` ModelConfig
# used, which meant cost-sentinel was failing. Bedrock was already reachable (Pod Identity, no keys).
#
# Bedrock auth: no api_key anywhere below. The `litellm` ServiceAccount is bound to the aria-bedrock
# IAM role via EKS Pod Identity (infra/02-eks/litellm.tf).
#
# Tier spread (input $/1M): haiku-3 0.25 → haiku-4.5 1.00 → sonnet-5 2.00 → opus-5 5.00. Four
# distinct models on purpose, so the model that served a call names the tier the router chose.
#
# SPEND GUARD (added 2026-09-26). Every deployment carries max_budget + budget_duration, which switches
# on LiteLLM's RouterBudgetLimiting: over budget, that deployment is filtered out of the routing pool.
# It needs NO Postgres — spend is tracked in a DualCache (in-memory here; Redis is only for multi-pod
# sync) — which is what makes it possible in this DB-less build.
#
# Why it exists: the smart-router can reach Opus 5 ($5/$25 per 1M) with a classifier deciding, and
# nothing else bounds that. Sizing is against real spend, not a guess — $1.70 total across the whole
# platform over the last 7 days, $0.91 in the busiest 24h (inflated by two 30-prompt eval runs).
#
# ⚠️ In-memory means the counters RESET WHEN THE POD RESTARTS, so a crash-looping proxy could exceed a
# daily cap across restarts. These are runaway stops, not accounting. Durable counters (and per-key
# virtual budgets) need `general_settings.database_url` + a Postgres — additive, deliberately deferred.
#
# ⚠️ The two Haiku numbers are deliberately UN-TRIPPABLE backstops, not budgets. bedrock-haiku-4-5 is
# what all 11 declarative agents actually use, so a cap that trips there is a fleet-wide outage — the
# exact failure this platform already inflicted on itself once. Set ~20x observed weekly spend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # Regional APAC profile — the older, much cheaper Haiku. The floor of the tier ladder.
      - model_name: bedrock-haiku-3
        litellm_params:
          model: bedrock/apac.anthropic.claude-3-haiku-20240307-v1:0
          aws_region_name: ap-southeast-1
          max_budget: 5 # USD # backstop only (~3x total weekly platform spend); also serves the router's classifier calls
          budget_duration: 1d
      - model_name: bedrock-haiku-4-5
        litellm_params:
          model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
          aws_region_name: ap-southeast-1
          max_budget: 20 # USD # backstop only — the whole fleet runs on this; tripping it = fleet outage
          budget_duration: 1d
      - model_name: bedrock-sonnet-5
        litellm_params:
          model: bedrock/global.anthropic.claude-sonnet-5
          aws_region_name: ap-southeast-1
          max_budget: 5 # USD # real cap: COMPLEX tier, $2/$10 per 1M
          budget_duration: 1d
      - model_name: bedrock-opus-5
        litellm_params:
          model: bedrock/global.anthropic.claude-opus-5
          aws_region_name: ap-southeast-1
          max_budget: 2 # USD # real cap: REASONING tier, the expensive one at $5/$25 per 1M
          budget_duration: 1d

      # --- Amazon Nova. Added 2026-09-26: a second model FAMILY, not just more models. Two reasons.
      # (1) It gives fallbacks somewhere to go that is not the same vendor — the Azure removal proved a
      # single-family, single-endpoint model plane is a single point of failure.
      # (2) It drops the cheap floor ~4x: nova-lite is $0.063/1M in against haiku-3's $0.25, so the
      # SIMPLE tier stops being "the cheapest Anthropic model" and becomes actually cheap.
      # All confirmed ACTIVE in ap-southeast-1, no new credentials (same Pod Identity role).
      - model_name: nova-micro
        litellm_params:
          model: bedrock/apac.amazon.nova-micro-v1:0
          aws_region_name: ap-southeast-1
          max_budget: 2 # USD
          budget_duration: 1d
      - model_name: nova-lite
        litellm_params:
          model: bedrock/apac.amazon.nova-lite-v1:0
          aws_region_name: ap-southeast-1
          max_budget: 5 # USD — SIMPLE tier
          budget_duration: 1d
      - model_name: nova-pro
        litellm_params:
          model: bedrock/apac.amazon.nova-pro-v1:0
          aws_region_name: ap-southeast-1
          max_budget: 5 # USD — cross-family fallback for the fleet's own tier
          budget_duration: 1d

      # Embeddings for kagent's long-term memory (domain 8), replacing the dead Azure
      # text-embedding-3-large. Bedrock Titan embeddings are NOT offered in ap-southeast-1 (only
      # us-east-1), so this is Cohere Embed v4 via its global inference profile — verified live in
      # ap-southeast-1 on 2026-09-18. On-demand `cohere.embed-v4:0` is rejected; the `global.`
      # profile id is required.
      - model_name: cohere-embed-v4
        litellm_params:
          model: bedrock/global.cohere.embed-v4:0
          aws_region_name: ap-southeast-1

      # Complexity Auto Router. Default heuristic classifier: scores the newest human ask locally,
      # no extra API call. Tiers reference model_name entries above. session_affinity left at its
      # default (off) for the first run — testing whether that matters inside an agent tool loop is
      # part of the build (README.md, v2).
      - model_name: smart-router
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_config:
            tiers:
              # SIMPLE crossed to Nova 2026-09-26 — 4x cheaper than haiku-3 for the same trivial asks.
              SIMPLE: nova-lite
              MEDIUM: bedrock-haiku-4-5
              COMPLEX: bedrock-sonnet-5
              REASONING: bedrock-opus-5
            # Response body `model` names the real model that answered instead of echoing
            # "smart-router" — per-call ground truth for which tier was chosen, used by
            # router-eval/run.py.
            return_raw_model_name: true
            # 2026-09-19: switched from the default heuristic scorer to an LLM classifier after the
            # 30-prompt eval (router-eval/) showed the heuristic escalated 0 of 14 genuinely hard
            # prompts. Its hardest score was 0.340 against a 0.35 COMPLEX boundary, and 11 of 14 hard
            # prompts scored at or below a trivial "what port does the API server listen on" (0.300),
            # so no boundary tuning separates them — best achievable was 77% and only by escalating
            # nearly everything. The classifier costs one extra small call per request; Haiku 3 is the
            # cheapest route here ($0.25/1M in), and it goes through this same proxy so budgets,
            # Langfuse logging and fallbacks all still apply to it.
            classifier_type: llm
            classifier_llm_config:
              # Left on haiku-3, not moved to the cheaper nova-micro: 27/30 was measured with THIS
              # classifier, and swapping it invalidates that result. Retesting classification quality on
              # nova-micro ($0.037/1M, cheapest route here) is its own experiment, not a free win.
              model: bedrock-haiku-3
              timeout_ms: 4000
          complexity_router_default_model: bedrock-sonnet-5

    router_settings:
      # FALLBACKS — the direct answer to the 2026-09-18 outage. Azure's removal killed every agent at
      # once because each ModelConfig named exactly one endpoint and nothing else. Now every tier has
      # somewhere to go, and the first hop out of each is a DIFFERENT model family, so one vendor
      # failing degrades quality instead of ending service.
      #
      # This also makes the newly-enforced budgets safe: when a tier hits its daily cap it is filtered
      # out of the pool, and a fallback catches the request rather than the caller seeing an error.
      fallbacks:
        - bedrock-haiku-4-5: [nova-pro, bedrock-sonnet-5] # the fleet's own tier — cross-family first
        - nova-lite: [bedrock-haiku-3, nova-micro]
        - nova-micro: [nova-lite]
        - bedrock-haiku-3: [nova-lite]
        - bedrock-sonnet-5: [nova-pro, bedrock-haiku-4-5]
        - bedrock-opus-5: [bedrock-sonnet-5]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Budget enforcement REQUIRES this. Without a database LiteLLM accepts every budget above and
      # enforces none of them — proven three ways on a throwaway proxy, and stated in upstream source:
      # "the budget will NOT be enforced and requests will never be blocked. Set DATABASE_URL".
      # Supplied as the DATABASE_URL env var by ESO (externalsecret-litellm-postgres.yaml).
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      success_callback: ["langfuse"]
